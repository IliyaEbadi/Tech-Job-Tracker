[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toronto-tech-job-tracker"
version = "1.0.0"
description = "Daily tracker for entry-level tech job postings in Toronto and the GTA."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
job-tracker = "job_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# A small, practical rule set: pyflakes, pycodestyle, import sorting,
# modern syntax, common bugs, and simplification hints.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
# "conftest" is a local test helper module, not a third-party package.
known-first-party = ["job_tracker", "conftest"]
